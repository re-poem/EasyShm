name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to nuget.org
        type: boolean
        default: false

env:
  SOLUTION: EasyShm.slnx
  DOTNET_VERSION: 10.0.x
  NUGET_USER: RE_Poem
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest # windows-latest for Windows-only libraries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test "$SOLUTION" -c Release --no-build

      - name: Pack
        run: >
          dotnet pack "$SOLUTION" -c Release --no-build -o artifacts
          -p:IncludeSymbols=true
          -p:SymbolPackageFormat=snupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate